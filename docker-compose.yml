networks:
  rede-k6:

services:
  influxdb:
    image: influxdb:1.8
    networks:
      - rede-k6
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6

  grafana:
    image: grafana/grafana:latest
    networks:
      - rede-k6
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_BASIC_ENABLED=false
    depends_on:
      - influxdb

  k6:
    image: grafana/k6:latest
    networks:
      - rede-k6
    volumes:
      - ./scripts:/scripts